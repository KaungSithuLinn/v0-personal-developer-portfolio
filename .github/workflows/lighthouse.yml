name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - desktop
          - mobile
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (${{ matrix.preset }})
        run: |
          if [ "${{ matrix.preset }}" = "desktop" ]; then
            npx --no-install lhci autorun --config=./lighthouserc.json
          else
            npx --no-install lhci autorun --config=./lighthouserc.mobile.json
          fi
        env:
          # The mobile config inherits from the GitHub Actions runner; the
          # LHCI assertions are tuned for cold-cache (no warm-up run) so
          # numberOfRuns=1 is the right mode here.
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          LHCI_BUILD_CONTEXT__COMMIT_SHA: ${{ github.sha }}
