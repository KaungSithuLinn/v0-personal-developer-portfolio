name: Bundle Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm run lint
      - run: pnpm run build
        env:
          ANALYZE: true
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: .next/analyze/__bundle_analyzer_report.html
          retention-days: 14
